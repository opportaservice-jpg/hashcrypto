txicon.out{background:#432632;color:var(--red)}.txmain{flex:1;min-width:0}.txtitle{font-weight:750;font-size:14px}.txmeta{font-size:11px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.status{display:inline-block;margin-top:7px;font-size:10px;font-weight:800;padding:4px 7px;border-radius:7px;background:#26354a;color:#b9c8dc}.status.completed,.status.confirmed,.status.approved{background:#123b35;color:#6ee7b7}.status.pending,.status.processing{background:#49391b;color:#fcd34d}.status.rejected,.status.failed,.status.cancelled{background:#48242d;color:#fda4af}.amount{text-align:right;min-width:95px;font-size:13px;font-weight:800;overflow-wrap:anywhere}.amount.in{color:var(--green)}.amount.out{color:var(--red)}.amount small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:38px 10px;font-size:13px}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:7px}.notice{display:none;border-radius:12px;padding:12px;margin-bottom:12px;font-size:12px;background:#43242d;color:#fecdd3}.notice.show{display:block}.loading{padding:24px;text-align:center;color:var(--muted);font-size:13px}.more{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1728;color:var(--cyan);font-weight:750;cursor:pointer}.foot{text-align:center;color:#61758e;font-size:10px;margin-top:17px}.detail{margin-top:12px;padding:12px;background:#091526;border:1px solid var(--line);border-radius:12px;font-size:12px;color:#b7c7da;display:none;overflow-wrap:anywhere}.detail.open{display:block}.detail div{margin:5px 0}.detail b{color:#edf6ff}@media(min-width:600px){.wrap{padding-top:28px}.summary{grid-template-columns:1fr 1fr}.panel{padding:20px}}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 10% 5%,#0f3a4d 0,transparent 42%),radial-gradient(ellipse at 95% 95%,#1a2c64 0,transparent 42%),radial-gradient(ellipse at 85% 12%,#3a2a0f44 0,transparent 35%),var(--bg)}

<script>
(() => {
  const SUPABASE_URL = "https://dcpgsrcrwnkcznykehgt.supabase.co";
  const $ = id => document.getElementById(id);
  let all = [], activeFilter = "all", offset = 0, pageSize = 50, loading = false, hasMore = true;
  const token = () => localStorage.getItem("hashcoin_token") || sessionStorage.getItem("hashcoin_token") || "";
  function showError(message){const n=$("notice");n.textContent=message;n.classList.add("show")}
  function clearError(){$("notice").classList.remove("show")}
  async function call(fn, action, extra={}) {
    const t=token();
    if(!t) throw new Error("Session absente. Connectez-vous à HASHCRYPTO puis revenez au portefeuille.");
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${fn}`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${t}`},body:JSON.stringify({action,token:t,...extra})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || `Impossible de charger ${fn}.`);
    return data;
  }
  function classify(tx){
    if(tx.kind) return tx.kind;
    const s=((tx.type||"")+" "+(tx.description||"")+" "+(tx.transaction_id||tx.reference||"")).toLowerCase();
    if(s.includes("deposit")||s.includes("dépôt")||s.includes("depot"))return "deposit";
    if(s.includes("withdraw")||s.includes("retrait"))return "withdrawal";
    if(s.includes("mining")||s.includes("mine")||s.includes("accrual")||s.includes("revenu"))return "mining";
    if(s.includes("conversion")||s.includes("convert"))return "conversion";
    if(s.includes("referral")||s.includes("parrain")||s.includes("commission"))return "referral";
    return "other";
  }
  function label(tx){const k=classify(tx);return ({deposit:"Demande de dépôt",withdrawal:"Demande de retrait",mining:"Revenu du minage",conversion:"Conversion",referral:"Commission de parrainage",other:tx.description||String(tx.type||"Opération").replaceAll("_"," ")})[k]}
  function icon(tx){const k=classify(tx);const P={deposit:'<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',withdrawal:'<path d="M12 20V9M7 13.5l5-5 5 5M5 4h14"/>',mining:'<rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/>',conversion:'<path d="M4 8h14M14.5 4.5 18 8l-3.5 3.5M20 16H6M9.5 12.5 6 16l3.5 3.5"/>',referral:'<circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.3 10.8 15.7 7.2M8.3 13.2l7.4 3.6"/>',other:'<path d="M5 8h13M14.5 4.5 18 8l-3.5 3.5M19 16H6"/>'};return '<svg viewBox="0 0 24 24" aria-hidden="true">'+P[k]+'</svg>'}
  function statusLabel(s){return ({completed:"Terminé",confirmed:"Confirmé",approved:"Validé",pending:"En attente",processing:"En cours",rejected:"Rejeté",failed:"Échoué",cancelled:"Annulé",paid:"Payé",success:"Réussi"})[(s||"").toLowerCase()]||s||"Non précisé"}
  function fmtAmount(value,asset){const n=Number(value);if(!Number.isFinite(n))return `${value??"—"} ${asset||""}`;const a=String(asset||"XOF").toUpperCase(),digits=a==="BTC"?8:a==="USDT"?4:0;return `${n.toLocaleString("fr-FR",{maximumFractionDigits:digits,minimumFractionDigits:0})} ${a==="XOF"?"FCFA":a}`.trim()}
  function signed(tx){const k=classify(tx),n=Number(tx.amount||0),outgoing=k==="withdrawal"||(k==="conversion"&&String(tx.description||"").toLowerCase().includes("from"));return {text:(outgoing?"−":(n>=0?"+":""))+fmtAmount(Math.abs(n),tx.asset),cls:outgoing||n<0?"out":"in"}}
  function dateFmt(d){if(!d)return "Date indisponible";const dt=new Date(d);return Number.isNaN(dt.getTime())?"Date indisponible":dt.toLocaleString("fr-FR",{dateStyle:"medium",timeStyle:"short"})}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function normRequest(row,kind){const isDep=kind==="deposit",ref=row.deposit_id||row.withdrawal_id||row.transaction_id||row.id||"";return {...row,kind,type:kind,transaction_id:String(ref),reference:String(ref),asset:row.asset||"XOF",description:isDep?"Demande de dépôt":"Demande de retrait",created_at:row.created_at||row.requested_at,status:row.status||"pending",_request:true}}
  function mergeUnique(rows){const seen=new Set();return rows.filter(x=>{const key=`${classify(x)}|${String(x.transaction_id||x.reference||x.id||"")}|${String(x.created_at||"")}|${String(x.amount||"")}`;if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0))}
  function render(){
    const q=$("search").value.trim().toLowerCase(),asset=$("asset").value;
    const filtered=all.filter(tx=>(activeFilter==="all"||classify(tx)===activeFilter)&&(!q||[tx.transaction_id,tx.reference,tx.description,tx.type].some(v=>String(v||"").toLowerCase().includes(q)))&&(asset==="all"||String(tx.asset||"").toUpperCase()===asset));
    $("count").textContent=filtered.length;
    $("pendingCount").textContent=all.filter(tx=>["pending","processing"].includes(String(tx.status||"").toLowerCase())).length;
    if(!filtered.length){$("list").innerHTML='<div class="empty"><b>Aucune opération trouvée</b>Les dépôts, retraits et autres mouvements de votre compte apparaîtront ici.</div>';return}
    $("list").innerHTML=filtered.map((tx,i)=>{const a=signed(tx),st=String(tx.status||"").toLowerCase(),id=String(tx.transaction_id||tx.reference||tx.id||"—"),detailId=`d${i}`;return `<article class="tx"><div class="txicon ${a.cls}">${icon(tx)}</div><div class="txmain"><div class="txtitle">${esc(label(tx))}</div><div class="txmeta">${esc(dateFmt(tx.created_at))} · Réf. ${esc(id)}</div><span class="status ${esc(st)}">${esc(statusLabel(st))}</span><div class="detail" id="${detailId}"><div><b>Référence :</b> ${esc(id)}</div><div><b>Type :</b> ${esc(label(tx))}</div><div><b>Montant :</b> ${esc(fmtAmount(tx.amount,tx.asset))}</div><div><b>Statut :</b> ${esc(statusLabel(st))}</div><div><b>Date :</b> ${esc(dateFmt(tx.created_at))}</div>${tx.payer_phone?`<div><b>Téléphone payeur :</b> ${esc(tx.payer_phone)}</div>`:""}${tx.description?`<div><b>Détails :</b> ${esc(tx.description)}</div>`:""}</div></div><div class="amount ${a.cls}">${esc(a.text)}<small><button type="button" data-detail="${detailId}" style="background:none;border:0;color:#00e0b5;padding:0;cursor:pointer;font-weight:700">Détails</button></small></div></article>`}).join("");
    $("list").querySelectorAll("[data-detail]").forEach(b=>b.addEventListener("click",()=>$(b.dataset.detail).classList.toggle("open")));
  }
  async function load(reset=true){
    if(loading)return;loading=true;clearError();if(reset){offset=0;hasMore=true;all=[];$("list").innerHTML='<div class="loading">Chargement du portefeuille…</div>'}
    try{
      const [ledgerRes,depRes,wdRes]=await Promise.all([
        call("hashcoin-core","transactions",{limit:pageSize,offset}),
        reset?call("hashcoin-deposits","my_deposits",{limit:100}):Promise.resolve(null),
        reset?call("hashcoin-withdrawals","my_withdrawals",{limit:100}):Promise.resolve(null)
      ]);
      const ledger=Array.isArray(ledgerRes.transactions)?ledgerRes.transactions:[];
      const requests=[];
      if(depRes&&Array.isArray(depRes.deposits))requests.push(...depRes.deposits.map(r=>normRequest(r,"deposit")));
      if(wdRes&&Array.isArray(wdRes.withdrawals))requests.push(...wdRes.withdrawals.map(r=>normRequest(r,"withdrawal")));
      // Ledger rows are authoritative for completed movements; keep request rows for pending/rejected items, or if no ledger row represents them.
      const represented=(r)=>ledger.some(t=>{const ids=[t.transaction_id,t.reference,t.metadata?.deposit_id,t.metadata?.withdrawal_id,t.metadata?.request_id].map(v=>String(v||""));return ids.includes(String(r.transaction_id||""))});
      const visibleRequests=requests.filter(r=>["pending","processing","rejected","failed","cancelled"].includes(String(r.status).toLowerCase())||!represented(r));
      all=mergeUnique([...all,...ledger,...visibleRequests]);
      offset+=ledger.length;hasMore=ledger.length===pageSize;
      render();$("more").style.display=hasMore?"block":"none";
    }catch(e){if(!all.length)$("list").innerHTML='<div class="empty"><b>Portefeuille indisponible</b>Vérifiez votre connexion et réessayez.</div>';showError(e.message)}finally{loading=false}
  }
  $("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
  $("search").addEventListener("input",render);$("asset").addEventListener("change",render);
  $("more").addEventListener("click",()=>load(false));
  const refresh=document.createElement("button");refresh.type="button";refresh.className="more";refresh.style.marginTop="10px";refresh.textContent="Actualiser le portefeuille";refresh.addEventListener("click",()=>load(true));$("list").parentElement.appendChild(refresh);
  load(true);
})();
</script>
